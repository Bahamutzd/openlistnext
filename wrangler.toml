name = "openlistnextpro"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# /p /d /api 必须先走 Worker，不能被静态资源 SPA fallback 吃掉
run_worker_first = ["/api/*", "/d/*", "/p/*", "/sd/*", "/dav/*"]


[vars]
ENVIRONMENT = "production"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin"
VITE_API_URL = "/api"

[[kv_namespaces]]
binding = "OPENLISTNEXT_KV"




